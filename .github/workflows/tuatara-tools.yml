name: Tuatara tools

on:
  push:
    branches: [tuatara]
    paths: ["tuatara/**", "ntcompat/**", ".github/workflows/tuatara-tools.yml"]
  pull_request:
    branches: [tuatara]
    paths: ["tuatara/**", "ntcompat/**", ".github/workflows/tuatara-tools.yml"]

permissions:
  contents: read

jobs:
  apiaudit:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the tuatara/ folder only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tuatara
            ntcompat
          sparse-checkout-cone-mode: true

      - name: Install LLVM tools for the test fixtures
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm

      - name: Run apiaudit tests
        run: python3 -m unittest discover -v -s tuatara/tools/apiaudit/tests -t tuatara/tools

      - name: Check the generated ntcompat thunk tables are up to date
        run: python3 ntcompat/thunks/gen.py --check

      - name: Check the allowlist parses
        run: |
          python3 -c "import sys; sys.path.insert(0, 'tuatara/tools'); \
          from apiaudit import audit; \
          print(len(audit.load_allowlist('tuatara/apiaudit-allowlist.toml')), 'allowlist entries')"
